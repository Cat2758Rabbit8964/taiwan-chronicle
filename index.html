<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>台灣事件簿</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="timeline-wrap">
  <div class="brand">台灣事件簿 <small>點選時間軸上的年份</small><a href="game.html" style="margin-left:12px;font-size:12px;font-weight:400">小遊戲:找尋您的前世</a><span class="legend" title="每個點的顏色深淺代表該年事件的最完整程度">內容完整度:<i class="lg q-full"></i>完整 <i class="lg q-detail"></i>詳細 <i class="lg q-brief"></i>簡述</span></div>
  <div id="timeline" role="tablist" aria-label="時間軸"></div>
</header>
<section id="yearbar"><span id="year-big">—</span><span id="year-era"></span></section>
<main id="map-wrap">
  <div id="map"></div>
  <svg id="lines"></svg>
  <div id="callouts"></div>
  <div id="chips"></div>
</main>
<section id="panel">
  <nav id="tabs">
    <button data-tab="events" class="active">事件</button>
    <button data-tab="era">這個時代</button>
  </nav>
  <div id="tab-events" class="tabbody"></div>
  <div id="tab-era" class="tabbody" hidden></div>
</section>
<div id="modal" hidden><div id="modal-box"><button id="modal-close" aria-label="關閉">✕</button><div id="modal-body"></div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.js"></script>
<script src="app.js"></script>
</body>
</html>
